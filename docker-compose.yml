services:
  mongo:
    image: mongo:7
    restart: unless-stopped

  backend:
    build: ./apps/backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/anamnesedb
      PORT: 3000
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-8080}
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build: ./apps/frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
